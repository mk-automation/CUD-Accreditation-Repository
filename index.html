<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CUD Accreditation Repository Demo</title><style>
:root{--r:#a20b2f;--d:#17191d;--g:#c8a24b;--bg:#f4f6f8;--ok:#168653;--warn:#dc8512;--mut:#69717c}*{box-sizing:border-box}body{margin:0;font:14px Arial;background:var(--bg);color:#20242a}.top{background:linear-gradient(105deg,#15171b,#342326 70%,#850827);color:white;padding:20px 28px;border-bottom:4px solid var(--g);display:flex;justify-content:space-between}.brand b{font-size:23px}.brand span{display:block;color:#ddd;margin-top:5px}.pill{border:1px solid #ffffff33;padding:8px 12px;border-radius:20px}.nav{background:white;padding:0 28px;display:flex;gap:6px;box-shadow:0 2px 10px #0001;overflow:auto}.nav button{border:0;background:none;padding:15px 14px;font-weight:700;cursor:pointer;white-space:nowrap}.nav button.active{color:var(--r);border-bottom:3px solid var(--r)}main{max-width:1450px;margin:auto;padding:26px}.page{display:none}.page.active{display:block}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.hero h1{margin:0;font-size:28px}.hero p{color:var(--mut);margin:7px 0 0}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--r);color:white;font-weight:700;cursor:pointer}.btn.alt{background:var(--d)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:white;border-radius:13px;border:1px solid #e4e7eb;box-shadow:0 4px 16px #0000000c}.card{padding:17px;border-top:4px solid var(--r)}.card small{color:var(--mut);font-weight:700}.card strong{display:block;font-size:29px;margin-top:8px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px;margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 15px}table{width:100%;border-collapse:collapse}th{text-align:left;color:#666;font-size:12px;padding:10px;border-bottom:1px solid #ddd}td{padding:11px 10px;border-bottom:1px solid #eee}.status{padding:5px 9px;border-radius:15px;font-size:12px;font-weight:700}.valid{background:#e3f5eb;color:var(--ok)}.soon{background:#fff0da;color:#ad6500}.expired{background:#fde4e8;color:var(--r)}.alert{padding:12px;border-left:4px solid var(--warn);background:#fff8eb;margin:9px 0;border-radius:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:260px;margin:0}.bar{height:10px;background:#eee;border-radius:8px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--r)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd0d6;border-radius:7px;margin:5px 0 12px}.doc{color:var(--r);font-weight:700;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:5}.modal>div{background:#fff;width:min(680px,92vw);border-radius:14px;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.foot{text-align:center;color:#777;padding:24px}.reporthead{border-left:5px solid var(--r);padding-left:12px}.note{background:#eef1f5;padding:12px;border-radius:8px;color:#555}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid,.row{grid-template-columns:1fr}}@media print{.top,.nav,.btn,.toolbar,.foot{display:none!important}main{padding:0}.page{display:none!important}#reports{display:block!important}.panel{box-shadow:none}}
</style></head><body><header class='top'><div class='brand'><b>CANADIAN UNIVERSITY DUBAI</b><span>Accreditation & Document Repository</span></div><div class='pill'>IRP Demo • Management View</div></header><nav class='nav' id='nav'></nav><main id='main'></main><div class='foot'>Interactive GitHub Pages demonstration • Dummy data only • No confidential documents</div><div class='modal' id='modal'><div><h2>Add Accreditation — Demo</h2><div class='row'><label>Program<select id='mprog'></select></label><label>Accreditation Body<select id='mbody'></select></label></div><div class='row'><label>Valid From<input id='mfrom' type='date'></label><label>Valid Until<input id='muntil' type='date'></label></div><label>Reference No.<input id='mref' placeholder='e.g. DEMO-2026-001'></label><button class='btn' onclick='addRecord()'>Save Demo Record</button> <button class='btn alt' onclick='closeModal()'>Cancel</button></div></div><script>
const today=new Date('2026-09-27T12:00:00');
const programs=['BSc Computer Science','BSc Cyber Security','Bachelor of Architecture','BBA','MBA','BSc Electrical Engineering','BA Psychology','BSc Software Development','BSc Network Engineering','BSc Artificial Intelligence','BSc Public Health','BSc Environmental Health Management','BA Communication','BBA Accounting & Finance','BBA Marketing','BBA HR Management','BBA International Business','BBA Entrepreneurship','MSc Information Technology Management','MSc Data Science','MSc Cybersecurity','Master of Architecture','MSc Public Health','MA Communication','DBA','Executive MBA','BSc Interior Design','BSc Creative Industries','BSc Mechatronics','BSc Civil Engineering','BSc Biomedical Engineering','BSc Sustainability'];
const bodies=['CAA / MoHESR','ABET','AACSB','NAAB','ECO Canada','CIDA','ICAEW','ACCA'];
let records=programs.map((p,i)=>({program:p,body:i<2?'CAA / MoHESR + ABET':i==2?'CAA / MoHESR + NAAB':i==10||i==11?'CAA / MoHESR + ECO Canada':i==26?'CAA / MoHESR + CIDA':'CAA / MoHESR',from:'2022-10-01',until:['2032-09-30','2032-09-30','2026-12-15','2026-11-30','2026-08-31','2027-05-30','2027-01-31','2028-03-15','2027-09-30','2028-06-30','2027-04-30','2027-02-28'][i%12],ref:'CUD-DEMO-'+String(i+1).padStart(3,'0')}));
records=records.concat([{program:'BBA',body:'AACSB',from:'2025-01-01',until:'2027-12-31',ref:'DEMO-AACSB-01'},{program:'Bachelor of Architecture',body:'NAAB',from:'2023-01-01',until:'2026-12-15',ref:'DEMO-NAAB-01'},{program:'BSc Public Health',body:'ECO Canada',from:'2024-01-01',until:'2027-04-30',ref:'DEMO-ECO-01'},{program:'BSc Interior Design',body:'CIDA',from:'2024-06-01',until:'2028-05-31',ref:'DEMO-CIDA-01'}]);
function status(r){let d=(new Date(r.until)-today)/86400000;return d<0?['Expired','expired']:d<=90?['Renewal Due','soon']:['Valid','valid']}
function days(r){return Math.ceil((new Date(r.until)-today)/86400000)}
const tabs=[['dashboard','Dashboard'],['programs','Programs'],['accreditations','Accreditations'],['documents','Documents'],['alerts','Renewal Alerts'],['reports','Reports']];
nav.innerHTML=tabs.map((t,i)=>`<button class='${i?'':'active'}' onclick="show('${t[0]}',this)">${t[1]}</button>`).join('');
function show(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(id==='reports')renderReport()}
function tableRows(rs){return rs.map(r=>{let s=status(r);return `<tr><td>${r.program}</td><td>${r.body}</td><td>${r.until}</td><td><span class='status ${s[1]}'>${s[0]}</span></td><td><span class='doc' onclick="downloadDoc('${r.ref}')">Download</span></td></tr>`}).join('')}
function stats(){let v=records.filter(r=>status(r)[0]=='Valid').length,so=records.filter(r=>status(r)[0]=='Renewal Due').length,e=records.filter(r=>status(r)[0]=='Expired').length;return [v,so,e]}
function render(){let [v,so,e]=stats();main.innerHTML=`<section id='dashboard' class='page active'><div class='hero'><div><h1>Accreditation Dashboard</h1><p>Interactive dummy portfolio for management demonstration.</p></div><button class='btn' onclick='openModal()'>+ Add Accreditation</button></div><div class='cards'><div class='card'><small>PROGRAMS</small><strong>${programs.length}</strong></div><div class='card'><small>ACCREDITATION RECORDS</small><strong>${records.length}</strong></div><div class='card' style='border-color:#168653'><small>VALID</small><strong>${v}</strong></div><div class='card' style='border-color:#dc8512'><small>EXPIRING ≤ 90 DAYS</small><strong>${so}</strong></div><div class='card'><small>EXPIRED / ACTION</small><strong>${e}</strong></div></div><div class='grid'><div class='panel'><h2>Priority Accreditation Status</h2><table><tr><th>PROGRAM</th><th>BODY</th><th>VALID UNTIL</th><th>STATUS</th><th>DOCUMENT</th></tr>${tableRows(records.slice(0,10))}</table></div><div><div class='panel'><h2>Portfolio Health</h2>${bodies.slice(0,6).map((b,i)=>`<b>${b}</b><div class='bar'><i style='width:${92-i*5}%'></i></div>`).join('')}</div><div class='panel'><h2>Renewal Alerts</h2>${records.filter(r=>days(r)<=90).slice(0,5).map(r=>`<div class='alert'><b>${r.program}</b><br>${days(r)<0?'Expired '+Math.abs(days(r))+' days ago':'Validity ends in '+days(r)+' days'}</div>`).join('')}</div></div></div></section>
<section id='programs' class='page'><div class='hero'><div><h1>Programs</h1><p>Dummy program master with accreditation coverage.</p></div></div><div class='panel'><div class='toolbar'><input id='psearch' placeholder='Search program...' oninput='filterPrograms()'></div><table><thead><tr><th>#</th><th>PROGRAM</th><th>ACCREDITATIONS</th><th>NEXT EXPIRY</th><th>STATUS</th></tr></thead><tbody id='ptbody'></tbody></table></div></section>
<section id='accreditations' class='page'><div class='hero'><div><h1>Accreditations</h1><p>CAA/MoHESR and professional accreditation records.</p></div><button class='btn' onclick='openModal()'>+ Add Accreditation</button></div><div class='panel'><div class='toolbar'><select id='afilter' onchange='filterAcc()'><option>All Bodies</option>${bodies.map(x=>`<option>${x}</option>`).join('')}</select><input id='asearch' placeholder='Search...' oninput='filterAcc()'></div><table><tr><th>PROGRAM</th><th>BODY</th><th>VALID UNTIL</th><th>STATUS</th><th>DOCUMENT</th></tr><tbody id='atbody'></tbody></table></div></section>
<section id='documents' class='page'><div class='hero'><div><h1>Document Repository</h1><p>Demonstration document register. Downloads generate sample text evidence files.</p></div></div><div class='panel'><table><tr><th>DOCUMENT</th><th>PROGRAM</th><th>BODY</th><th>REFERENCE</th><th>ACTION</th></tr>${records.slice(0,25).map(r=>`<tr><td>Accreditation Certificate / Decision</td><td>${r.program}</td><td>${r.body}</td><td>${r.ref}</td><td><span class='doc' onclick="downloadDoc('${r.ref}')">Download</span></td></tr>`).join('')}</table></div></section>
<section id='alerts' class='page'><div class='hero'><div><h1>Renewal Alerts</h1><p>90-day early-warning view as of 27 September 2026.</p></div></div><div class='panel'>${records.filter(r=>days(r)<=90).sort((a,b)=>days(a)-days(b)).map(r=>`<div class='alert'><b>${r.program} — ${r.body}</b><br>Valid until ${r.until} • ${days(r)<0?'EXPIRED '+Math.abs(days(r))+' days ago':days(r)+' days remaining'}</div>`).join('')||'No alerts.'}</div></section>
<section id='reports' class='page'><div class='hero'><div><h1>Management Reports</h1><p>Generate, print or export the current dummy accreditation status.</p></div><div><button class='btn' onclick='window.print()'>Print / Save PDF</button> <button class='btn alt' onclick='exportCSV()'>Export CSV</button></div></div><div id='reportcontent'></div></section>`;filterPrograms();filterAcc();}
function filterPrograms(){let q=(document.getElementById('psearch')?.value||'').toLowerCase();ptbody.innerHTML=programs.filter(p=>p.toLowerCase().includes(q)).map((p,i)=>{let rr=records.filter(r=>r.program==p),n=rr.sort((a,b)=>new Date(a.until)-new Date(b.until))[0],s=status(n);return `<tr><td>${i+1}</td><td><b>${p}</b></td><td>${rr.map(x=>x.body).join(', ')}</td><td>${n.until}</td><td><span class='status ${s[1]}'>${s[0]}</span></td></tr>`}).join('')}
function filterAcc(){let b=document.getElementById('afilter')?.value||'All Bodies',q=(document.getElementById('asearch')?.value||'').toLowerCase();let rs=records.filter(r=>(b==='All Bodies'||r.body.includes(b))&&(r.program+' '+r.body).toLowerCase().includes(q));atbody.innerHTML=tableRows(rs)}
function renderReport(){let [v,so,e]=stats();reportcontent.innerHTML=`<div class='panel'><div class='reporthead'><h2>Program Accreditation Status Report</h2><p><b>Report date:</b> 27 September 2026 &nbsp; | &nbsp; <b>Prepared for:</b> Management Demonstration</p></div><div class='cards'><div class='card'><small>Programs</small><strong>${programs.length}</strong></div><div class='card'><small>Records</small><strong>${records.length}</strong></div><div class='card'><small>Valid</small><strong>${v}</strong></div><div class='card'><small>Due ≤90 Days</small><strong>${so}</strong></div><div class='card'><small>Expired</small><strong>${e}</strong></div></div><h2 style='margin-top:25px'>Detailed Status</h2><table><tr><th>PROGRAM</th><th>BODY</th><th>VALID UNTIL</th><th>STATUS</th><th>REMAINING DAYS</th></tr>${records.map(r=>{let s=status(r);return `<tr><td>${r.program}</td><td>${r.body}</td><td>${r.until}</td><td><span class='status ${s[1]}'>${s[0]}</span></td><td>${days(r)}</td></tr>`}).join('')}</table><p class='note'><b>Demo note:</b> All records and dates in this GitHub demonstration are sample data and must not be treated as official CUD accreditation information.</p></div>`}
function exportCSV(){let rows=[['Program','Accreditation Body','Valid From','Valid Until','Reference','Status','Days Remaining'],...records.map(r=>[r.program,r.body,r.from,r.until,r.ref,status(r)[0],days(r)])];let csv=rows.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');download('CUD_Accreditation_Status_Demo.csv',csv,'text/csv')}
function downloadDoc(ref){download(ref+'_Demo_Document.txt',`CANADIAN UNIVERSITY DUBAI\nACCREDITATION REPOSITORY - DEMO DOCUMENT\nReference: ${ref}\n\nThis is dummy evidence generated by the GitHub demonstration.\nNo official accreditation document is included.\n`,'text/plain')}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function openModal(){mprog.innerHTML=programs.map(x=>`<option>${x}</option>`).join('');mbody.innerHTML=bodies.map(x=>`<option>${x}</option>`).join('');modal.style.display='flex'}function closeModal(){modal.style.display='none'}
function addRecord(){if(!muntil.value){alert('Please select Valid Until date.');return}records.push({program:mprog.value,body:mbody.value,from:mfrom.value||'2026-01-01',until:muntil.value,ref:mref.value||'DEMO-NEW-'+(records.length+1)});closeModal();render();alert('Demo record added for this browser session.');}
modal.onclick=e=>{if(e.target===modal)closeModal()};render();
</script></body></html>
